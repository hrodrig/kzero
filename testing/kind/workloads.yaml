# Minimal Deployment for product-repo kind CI (#34).
# Full operator lab (multi-workload / PVC / counter) lives in kzero-selfhosted.
---
apiVersion: v1
kind: Namespace
metadata:
  name: kzero-kind
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kzero-kind
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
