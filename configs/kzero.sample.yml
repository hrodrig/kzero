# yaml-language-server: $schema=./kzero.schema.json
# Editors: VS Code / Cursor YAML extension uses the line above; or set
# "$schema": "https://raw.githubusercontent.com/hrodrig/kzero/main/configs/kzero.schema.json"
schema_version: "1.0"

# kzero v1 sample configuration (workloads + Helm + hooks).
# JSON Schema (editor autocomplete): configs/kzero.schema.json — runtime validation is still the Go loader.
#
# In scope: ordered pipeline steps (down/up), Helm releases via helm.workspace scripts,
# and optional custom scripts. This profile targets cluster workloads only, not node lifecycle.
# Out of scope for v1: cloud CLIs (az/aws/gcloud), node drain/cordon, Talos/k3s OS reset,
# automatic nodepool scaling.
#
# Optional later: if you add node evacuation, that can be a separate pipeline step or hook;
# it is intentionally omitted here because it is often unnecessary for workload-only resets.
#
# Credentials: use env vars or a secret manager; never commit secrets. Viper env prefix: KZERO_
# (e.g. KZERO_CLIENT_ID, KZERO_HELM_WORKSPACE, KZERO_NOTIFY_SLACK_WEBHOOK_URL).

cluster:
  name: "example-cluster"
  environment: "dev"
  description: "Reference profile for kzero v1"

# Helm workspace: prefer <release>.yaml chart manifests (default run.execution: native / Helm SDK).
# Opt-in run.execution: shell still uses <release>.sh install scripts (basename = release name).
helm:
  workspace: "./helm-assets"

# Optional label for run metadata (engine logs: client_id=…; hooks: KZERO_CLIENT_ID).
# Operator audit: Kubernetes target block prints os_user/os_uid; hooks also get KZERO_OS_USER / KZERO_OS_UID.
client:
  id: ""

# Prefer absolute paths for non-interactive runs (cron, systemd). Empty values may fall back to PATH.
# command.shell: interpreter for hooks / custom: / shell release .sh (default /bin/sh; set /bin/bash for bashisms).
command:
  helm: "/usr/local/bin/helm"
  kubectl: "/usr/local/bin/kubectl"
  # shell: "/bin/bash"

hooks:
  pre-down: ./hooks/pre-down.sh
  post-down: ./hooks/post-down.sh
  pre-up: ./hooks/pre-up.sh
  post-up: ./hooks/post-up.sh
  on-error: ./hooks/on-error.sh

# Notifications (live mode only for pipelines). Test without a pipeline: kzero notify test -c <file>
# Events: pipeline.start, pipeline.success, pipeline.error (plus notify.test via notify test).
# Cookbook: docs/examples/notifications.md
notify:
  on_error: true
  # When true, failed pipeline.error / pipeline.stalled POST fails the run (exit 4).
  require_delivery: false
  slack:
    enabled: false
    webhook_url: ""
  discord:
    enabled: false
    webhook_url: ""
  teams:
    enabled: false
    webhook_url: ""
  pagerduty:
    enabled: false
    routing_key: ""
  webhook:
    enabled: false
    url: ""
    headers: {}

pipelines:
  # Steps: compact strings (<kind>.<namespace>/<name>), maps on up for extra options,
  # or { custom: <script> }. Optional per-step hooks (pre/post) run shell scripts immediately
  # before/after that step's main action (post runs only if the main action succeeds).
  # On down, list order is sequential; scale-to-0 does not wait for pods unless you add post/pre hooks.
  # See docs/examples/pipeline-order-and-integrity.md
  down:
    - deployment.argocd/argocd-server
    - deployment.app/consumer:
        post: ./hooks/wait-deployment-scale-down.sh
    - deployment.app/producer
    - statefulset.database/postgresql:
        pre: ./hooks/before-pg-scale.sh
        post: ./hooks/after-pg-scale.sh
    - release.monitoring/kube-prometheus-stack
    - custom: ./hooks/example-custom.sh

  up:
    # Infra: wait between releases — see docs/examples/waiting-between-pipeline-steps.md
    # (§1 --wait in <release>.sh, §2 post hook, §3 wait_for_ready on workloads below)
    - release.monitoring/kube-prometheus-stack:
        post: ./hooks/wait-helm-release-ready.sh
    - deployment.app/producer:
        replicas: 1
        wait_for_ready: true
    - deployment.app/consumer:
        replicas: 1
        wait_for_ready: true
    - statefulset.database/postgresql:
        replicas: 3
        wait_for_ready: true
        timeout: 10m
    - deployment.argocd/argocd-server

# Post-up readiness (kzero verify). Checks pipelines.up workloads + optional node Ready.
verify:
  enabled: false
  checks:
    - workloads_ready
    - nodes_ready
  format: text   # text | json (CLI --log-format overrides for output)

# Infra probe: optional gate before destructive down/reset (live only when enabled).
# Goal: validate registry, image pull creds, StorageClass/PVC, Helm install — not app workloads.
# Use kzero-selfhosted run/examples/infra-probe/ (Redis reference: .sh for shell, .yaml chart manifest for native).
# Default execution is native (Helm SDK). Probe Redis: probe-redis.yaml under helm.workspace — see docs/examples/infra-probe/
# Standalone: kzero probe -c <file>
infra_probe:
  enabled: false
  before: ["reset"]          # default when enabled; add "down" to gate both
  fail_fast: true
  cache_ttl: 0               # e.g. 30m to skip repeat probes after success
  pipeline:
    up:
      - release.probe-ns/probe-redis
    down:
      - release.probe-ns/probe-redis
  checks:
    - pvc_bound: probe-ns/redis-data-probe-redis-master-0
    - release_ready: true

retry:
  attempts: 3
  delay: 8s

run:
  kubeconfig: ""
  mode: "dry-run"
  # execution omitted → native (1.0.0 #32). Opt-in: shell | auto
  color: "auto"   # elapsed-time line: auto | always | never (NO_COLOR disables)
  verify: false   # when true, run kzero verify after successful up / reset
  probe_cache_dir: ""   # default: OS user cache dir (kzero/probe); set for shared cache path
  timeout: 25m
  operation_timeout: 45s
